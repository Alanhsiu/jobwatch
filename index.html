<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobwatch — tracker</title>
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --line:#e9e8e4; --line-strong:#d8d7d2;
    --ink:#191917; --muted:#77756e; --faint:#a3a199;
    --seen:#0f766e; --seen-bg:#eff6f4;
    --drop:#a8443b; --drop-bg:#faf0ef;
    --ok:#0f766e; --warn:#b4772a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
       line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  header{position:sticky;top:0;z-index:5;background:rgba(251,251,250,.92);
         backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
  .wrap{max-width:820px;margin:0 auto}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .title h1{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .stat b{color:var(--ink);font-weight:600}
  .stat .s{color:var(--seen)} .stat .d{color:var(--drop)}
  .sync{margin-left:auto;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-strong);
        background:var(--surface);color:var(--muted);border-radius:20px;padding:4px 10px;cursor:pointer;
        display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .sync.on .dot{background:var(--ok)} .sync.busy .dot{background:var(--warn)} .sync.err .dot{background:var(--drop)}

  .controls{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:4px;background:#f0efec;border:1px solid var(--line);border-radius:9px;padding:3px}
  .tab{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:550}
  .search{flex:1;min-width:150px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
  .search:focus{outline:2px solid var(--seen);outline-offset:-1px;border-color:transparent}

  /* sync settings panel */
  .panel{max-width:820px;margin:10px auto 0;background:var(--surface);border:1px solid var(--line-strong);
         border-radius:12px;padding:14px 16px;display:none}
  .panel.open{display:block}
  .panel h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
  .panel p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .panel label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 3px;font-family:var(--mono)}
  .panel input{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;font-family:var(--mono)}
  .panel .btns{display:flex;gap:8px;margin-top:12px}
  .btn{font:inherit;font-size:13px;font-weight:550;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
  .btn.primary{background:var(--seen);border-color:var(--seen);color:#fff}
  .panel a{color:var(--seen);text-decoration:none} .panel a:hover{text-decoration:underline}
  .msg{font-size:12px;margin-top:8px;font-family:var(--mono)}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--drop)}

  main{max-width:820px;margin:0 auto;padding:8px 16px 80px}
  .group{margin-top:22px}
  .group h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
            margin:0 0 8px;padding:0 2px;display:flex;align-items:center;gap:8px}
  .group h2 .n{font-family:var(--mono);letter-spacing:0}
  .group h2::after{content:"";flex:1;height:1px;background:var(--line)}

  .row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
       border-radius:10px;padding:11px 12px;margin-bottom:7px;transition:opacity .12s ease,border-color .12s ease}
  .row .body{flex:1;min-width:0}
  .row .t{font-weight:550;letter-spacing:-.005em;text-decoration:none;display:inline-block}
  .row .t:hover{text-decoration:underline}
  .row .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta .tag{color:var(--faint)}
  .marks{display:flex;gap:6px;flex-shrink:0}
  .mark{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);
        cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:all .12s ease}
  .mark:hover{border-color:var(--muted);color:var(--muted)}
  .mark:focus-visible{outline:2px solid var(--seen);outline-offset:1px}
  .row[data-state="seen"]{border-color:var(--seen);background:var(--seen-bg)}
  .row[data-state="seen"] .mark.ok{background:var(--seen);border-color:var(--seen);color:#fff}
  .row[data-state="dropped"]{opacity:.55}
  .row[data-state="dropped"] .mark.no{background:var(--drop);border-color:var(--drop);color:#fff}

  .empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px}
  .empty .big{font-size:15px;color:var(--ink);font-weight:550;margin-bottom:4px}
  .foot{max-width:820px;margin:24px auto 0;padding:0 16px;color:var(--faint);font-size:11.5px;font-family:var(--mono)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title">
      <h1>jobwatch</h1>
      <span class="stat" id="stat">loading…</span>
      <button class="sync" id="syncBtn" title="Sync settings"><span class="dot"></span><span id="syncLabel">Sync off</span></button>
    </div>
    <div class="controls">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-f="todo" aria-selected="true">To review</button>
        <button class="tab" role="tab" data-f="seen" aria-selected="false">Seen</button>
        <button class="tab" role="tab" data-f="dropped" aria-selected="false">Dismissed</button>
        <button class="tab" role="tab" data-f="all" aria-selected="false">All</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Filter by company or title…" autocomplete="off">
    </div>
  </div>
</header>

<div class="panel" id="panel">
  <h3>Sync across devices</h3>
  <p>Your ✓/✕ are stored in <code>status.json</code> in your repo, so every device reads the same
     thing. Create a <b>fine-grained token</b> scoped to <em>only this repo</em> with
     <b>Contents: Read and write</b>, then paste it below. It's stored only in this browser.
     <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token →</a></p>
  <label for="repoIn">Repository (owner/repo)</label>
  <input id="repoIn" placeholder="alanhsiu/jobwatch" autocomplete="off">
  <label for="patIn">Fine-grained token</label>
  <input id="patIn" type="password" placeholder="github_pat_…" autocomplete="off">
  <div class="btns">
    <button class="btn primary" id="saveSync">Save &amp; sync</button>
    <button class="btn" id="clearSync">Turn off sync</button>
  </div>
  <div class="msg" id="syncMsg"></div>
</div>

<main id="list"><div class="empty">Loading roles…</div></main>
<div class="foot" id="foot"></div>

<script>
const LKEY = "jobwatch.status.v1";     // local cache of {id:'seen'|'dropped'}
const PKEY = "jobwatch.gh.pat";
const RKEY = "jobwatch.gh.repo";
const FILE = "status.json";
const BRANCH = "main";
const CAT_ORDER = {Quant:0, ML:1, SWE:2};

let roles = [];
let status = loadLocal();     // what the user sees
let dirty = {};               // {id: 'seen'|'dropped'|null(cleared)} pending since last push
let remoteSha = null;         // sha of status.json on remote (null = not created yet)
let filter = "todo";
let query = "";
let pushTimer = null;

/* ---------- storage helpers ---------- */
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LKEY)) || {}; }catch{ return {}; } }
function saveLocal(){ localStorage.setItem(LKEY, JSON.stringify(status)); }
function getPat(){ return localStorage.getItem(PKEY) || ""; }
function getRepo(){
  const o = localStorage.getItem(RKEY);
  if(o && o.includes("/")) return o;
  const host = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
  if(host.endsWith("github.io") && seg) return host.split(".")[0] + "/" + seg;
  return "";
}
function syncEnabled(){ return !!(getPat() && getRepo()); }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob((s||"").replace(/\n/g,"")))); }

/* ---------- GitHub API ---------- */
function ghHeaders(){
  const h = {"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const pat = getPat(); if(pat) h["Authorization"] = "Bearer " + pat;
  return h;
}
async function ghGet(){                       // -> {obj, sha}  (works unauth on public repos)
  const repo = getRepo(); if(!repo) return {obj:{}, sha:null};
  const url = `https://api.github.com/repos/${repo}/contents/${FILE}?ref=${BRANCH}&t=${Date.now()}`;
  const res = await fetch(url, {headers:ghHeaders(), cache:"no-store"});
  if(res.status === 404) return {obj:{}, sha:null};
  if(!res.ok) throw new Error("read " + res.status);
  const j = await res.json();
  let obj = {}; try{ obj = JSON.parse(b64dec(j.content)) || {}; }catch{}
  return {obj, sha:j.sha};
}
async function ghPut(obj, sha){
  const repo = getRepo();
  const url = `https://api.github.com/repos/${repo}/contents/${FILE}`;
  const body = {message:"jobwatch: update tracker state", content:b64enc(JSON.stringify(obj,null,1)), branch:BRANCH};
  if(sha) body.sha = sha;
  const res = await fetch(url, {method:"PUT", headers:{...ghHeaders(),"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok){ const t = await res.text(); throw new Error("write " + res.status + " " + t.slice(0,120)); }
  const j = await res.json();
  return j.content && j.content.sha;
}

/* ---------- sync flow ---------- */
async function pullRemote(initial){
  if(!getRepo()) { setSync("off"); return; }
  try{
    setSync("busy");
    const {obj, sha} = await ghGet();
    remoteSha = sha;
    // remote is the source of truth; re-apply any not-yet-pushed local changes on top
    const merged = {...obj};
    for(const [id,v] of Object.entries(dirty)){ if(v===null) delete merged[id]; else merged[id]=v; }
    status = merged; saveLocal(); render();
    setSync(syncEnabled() ? "on" : "off");
    if(Object.keys(dirty).length) schedulePush();
  }catch(e){ setSync("err", e.message); }
}
function schedulePush(){
  if(!syncEnabled()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 1000);   // debounce rapid triage into one commit
}
async function pushRemote(){
  if(!syncEnabled() || !Object.keys(dirty).length) return;
  try{
    setSync("busy");
    const {obj, sha} = await ghGet();          // fetch latest first -> merges other devices
    const merged = {...obj};
    for(const [id,v] of Object.entries(dirty)){ if(v===null) delete merged[id]; else merged[id]=v; }
    const newSha = await ghPut(merged, sha);
    remoteSha = newSha;
    status = merged; saveLocal();
    dirty = {};
    render(); setSync("on");
  }catch(e){ setSync("err", e.message); /* keep dirty for a later retry */ }
}
function setSync(state, detail){
  const btn = document.getElementById("syncBtn"), lbl = document.getElementById("syncLabel");
  btn.className = "sync" + (state==="on"?" on":state==="busy"?" busy":state==="err"?" err":"");
  lbl.textContent = state==="on"?"Sync on":state==="busy"?"Syncing…":state==="err"?"Sync error":"Sync off";
  if(state==="err" && detail){ const m=document.getElementById("syncMsg"); m.className="msg err"; m.textContent=detail; }
}

/* ---------- state changes ---------- */
function stateOf(id){ return status[id] || "todo"; }
function setState(id, s){
  if(stateOf(id) === s){ delete status[id]; dirty[id] = null; }
  else { status[id] = s; dirty[id] = s; }
  saveLocal(); render();
  if(syncEnabled()) schedulePush();
}

/* ---------- data + render ---------- */
async function boot(){
  try{
    const res = await fetch("roles.json?ts=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    roles = await res.json();
  }catch(e){
    document.getElementById("list").innerHTML =
      '<div class="empty"><div class="big">Couldn\'t load roles.json</div>'
      + 'Open this page via your GitHub Pages URL, and make sure the bot has run at least once.</div>';
    document.getElementById("stat").textContent = "";
  }
  render();
  // prefill settings + attempt a sync pull (public read works even without a token)
  document.getElementById("repoIn").value = getRepo();
  setSync(syncEnabled() ? "on" : "off");
  if(getRepo()) pullRemote(true);
}
function counts(){
  let seen=0, dropped=0;
  for(const r of roles){ const s=stateOf(r.id); if(s==="seen")seen++; else if(s==="dropped")dropped++; }
  return {total:roles.length, seen, dropped, todo:roles.length-seen-dropped};
}
function visible(){
  const q = query.trim().toLowerCase();
  return roles.filter(r=>{
    const s = stateOf(r.id);
    if(filter==="todo" && s!=="todo") return false;
    if(filter==="seen" && s!=="seen") return false;
    if(filter==="dropped" && s!=="dropped") return false;
    if(q && !(r.company.toLowerCase().includes(q) || r.title.toLowerCase().includes(q))) return false;
    return true;
  });
}
function render(){
  const c = counts();
  document.getElementById("stat").innerHTML =
    `<b>${c.todo}</b> to review · <span class="s"><b>${c.seen}</b> seen</span> · `
    + `<span class="d"><b>${c.dropped}</b> dismissed</span> · ${c.total} total`;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.f===filter));

  const rows = visible(), list = document.getElementById("list");
  if(!rows.length){
    const msg = {
      todo:["Inbox zero.","No roles left to review. New postings will show up here."],
      seen:["Nothing marked seen yet.","Tap the check on a role to keep track of it."],
      dropped:["Nothing dismissed.","Tap the cross to hide roles you're not interested in."],
      all:["No roles.","The bot hasn't found matches yet — check back after it runs."],
    }[filter];
    list.innerHTML = `<div class="empty"><div class="big">${msg[0]}</div>${msg[1]}</div>`;
    foot(); return;
  }
  const g = {};
  for(const r of rows){ (g[r.company] ||= []).push(r); }
  const companies = Object.keys(g).sort((a,b)=> g[b].length-g[a].length || a.localeCompare(b));
  let html = "";
  for(const co of companies){
    const items = g[co].sort((a,b)=>(CAT_ORDER[a.category]??9)-(CAT_ORDER[b.category]??9) || b.date_posted-a.date_posted);
    html += `<section class="group"><h2>${esc(co)} <span class="n">${items.length}</span></h2>`;
    for(const r of items){
      html += `<div class="row" data-state="${stateOf(r.id)}">
        <div class="body">
          <a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
          <div class="meta">${esc(r.location)} · ${esc(r.posted||"")} <span class="tag">· ${esc(r.category)}</span></div>
        </div>
        <div class="marks">
          <button class="mark ok" title="Mark reviewed / interested" data-id="${esc(r.id)}" data-s="seen" aria-label="Mark seen">✓</button>
          <button class="mark no" title="Dismiss / not interested" data-id="${esc(r.id)}" data-s="dropped" aria-label="Dismiss">✕</button>
        </div>
      </div>`;
    }
    html += `</section>`;
  }
  list.innerHTML = html;
  list.querySelectorAll(".mark").forEach(b=> b.addEventListener("click", ()=> setState(b.dataset.id, b.dataset.s)));
  foot();
}
function foot(){
  document.getElementById("foot").textContent = syncEnabled()
    ? "Synced to status.json in your repo — same marks on every device."
    : "Marks saved in this browser only. Turn on Sync to share them across devices.";
}
function esc(s){ return (s??"").replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e=>{ const t=e.target.closest(".tab"); if(t){ filter=t.dataset.f; render(); }});
document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; render(); });
document.getElementById("syncBtn").addEventListener("click", ()=> document.getElementById("panel").classList.toggle("open"));
document.getElementById("saveSync").addEventListener("click", async ()=>{
  const repo=document.getElementById("repoIn").value.trim(), pat=document.getElementById("patIn").value.trim();
  const m=document.getElementById("syncMsg");
  if(!repo.includes("/") || !pat){ m.className="msg err"; m.textContent="Enter owner/repo and a token."; return; }
  localStorage.setItem(RKEY, repo); localStorage.setItem(PKEY, pat);
  document.getElementById("patIn").value="";
  m.className="msg ok"; m.textContent="Saved. Syncing…";
  await pushRemote();            // push any local marks up first
  await pullRemote(true);        // then pull the merged truth
  if(syncEnabled()){ m.className="msg ok"; m.textContent="Sync is on for this device."; }
});
document.getElementById("clearSync").addEventListener("click", ()=>{
  localStorage.removeItem(PKEY);
  const m=document.getElementById("syncMsg"); m.className="msg"; m.textContent="Sync turned off on this device (your marks stay saved locally).";
  setSync("off"); foot();
});

boot();
</script>
</body>
</html>
